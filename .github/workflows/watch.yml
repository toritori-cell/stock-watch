name: stock-watch
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # 이미 도는 중이면 대기했다가 끝나는 즉시 이어받음
concurrency:
  group: stock-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WATCH_URLS: ${{ vars.WATCH_URLS }}
          INTERVAL_SEC: "30"
          MAX_RUNTIME_SEC: "19800"
          PYTHONIOENCODING: utf-8
